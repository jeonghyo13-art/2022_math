<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2022 개정 수학과 교육과정 암기 마스터 (1·2페이지)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .diff-correct { color: #166534; background-color: #dcfce7; padding: 0 1px; border-radius: 2px; }
    .diff-missing { color: #991b1b; background-color: #fee2e2; text-decoration: line-through; padding: 0 2px; border-radius: 2px; }
    .diff-extra { color: #854d0e; background-color: #fef9c3; padding: 0 2px; border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <span class="bg-indigo-600 text-amber-300 p-2.5 rounded-xl font-black text-xl shadow-inner">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight flex items-center gap-2">
            2022 개정 수학과 완벽 암기
            <span class="text-xs bg-amber-400 text-indigo-950 font-bold px-2 py-0.5 rounded-full">1·2페이지 원문</span>
          </h1>
          <p class="text-xs text-indigo-200">목표 · 교수학습방향/방법 · 평가방향/방법 토시 하나 놓치지 않는 백지 인출기</p>
        </div>
      </div>

      <!-- Quick Action Stats -->
      <div class="flex items-center gap-2 text-xs">
        <div class="bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-700/50 flex items-center gap-2">
          <span class="text-indigo-300">외운 항목:</span>
          <span id="mastered-count" class="font-bold text-amber-300">0</span> / <span id="total-count">0</span>
        </div>
        <button id="btn-toggle-bookmark-only" onclick="toggleBookmarkFilter()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-700/50 transition flex items-center gap-1.5 text-indigo-200">
          <i class="fa-solid fa-star text-amber-400"></i>
          <span>중요 암기만</span>
        </button>
      </div>
    </div>

    <!-- Navigation / Mode Bar -->
    <div class="bg-indigo-950 border-t border-indigo-800/60 px-4 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <!-- Learning Modes -->
        <div class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-1">
          <button onclick="setMode('study')" id="mode-study" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-indigo-600 text-white shadow">
            <i class="fa-solid fa-book-open"></i> 1. 정독&가림
          </button>
          <button onclick="setMode('firstchar')" id="mode-firstchar" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-indigo-200 hover:bg-indigo-800">
            <i class="fa-solid fa-font"></i> 2. 초성/첫글자
          </button>
          <button onclick="setMode('cloze')" id="mode-cloze" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-indigo-200 hover:bg-indigo-800">
            <i class="fa-solid fa-puzzle-piece"></i> 3. 빈칸 채우기
          </button>
          <button onclick="setMode('typing')" id="mode-typing" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-indigo-200 hover:bg-indigo-800">
            <i class="fa-solid fa-keyboard text-amber-300"></i> 4. 백지 인출&정밀대조
          </button>
        </div>

        <!-- Mode Sub-controls -->
        <div id="mode-sub-controls" class="flex items-center gap-2 text-xs">
          <!-- Dynamic inject -->
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Sidebar: Category & Item List -->
    <aside class="lg:col-span-4 xl:col-span-3 flex flex-col gap-4">
      <!-- Category Selection Tabs -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span>대분류 (1·2페이지 구조)</span>
          <span class="text-[10px] text-indigo-600 font-semibold cursor-pointer hover:underline" onclick="resetAllProgress()">진도 초기화</span>
        </h2>
        <div class="space-y-1.5" id="category-list">
          <!-- Injected via JS -->
        </div>
      </div>

        <div class="flex items-center justify-between mb-3">

        </div>
        <div class="space-y-1 overflow-y-auto max-h-[480px] custom-scrollbar pr-1" id="subitem-list">
          <!-- Injected via JS -->
        </div>
      </div>
    </aside>

    <!-- Right Workspace: Practice Area -->
    <section class="lg:col-span-8 xl:col-span-9 flex flex-col gap-4">
      
      <!-- Current Item Header Card -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 relative overflow-hidden">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
          <div class="flex items-center gap-2">
            <span id="badge-page" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-bold">1페이지</span>
            <span id="badge-cat" class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">수학과 목표</span>
            <span id="badge-num" class="text-xs font-bold text-slate-400">#1</span>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="speakCurrentText()" title="음성으로 듣기" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="toggleCurrentBookmark()" id="btn-star" title="중요 항목 보관" class="p-2 text-slate-300 hover:text-amber-500 hover:bg-amber-50 rounded-lg transition">
              <i class="fa-solid fa-star text-lg"></i>
            </button>
            <button onclick="markAsMastered()" id="btn-check" class="flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 hover:border-emerald-500 hover:text-emerald-600 transition">
              <i class="fa-regular fa-circle-check"></i>
              <span>암기 완료 표시</span>
            </button>
          </div>
        </div>

        <h3 id="current-item-title" class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight mb-1">
          수학과 총괄 목표
        </h3>
        <p id="current-item-path" class="text-xs text-slate-400 font-medium">
          2022 수학과 목표 > 총괄 목표
        </p>
      </div>

      <!-- Interactive Learning Viewport -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 min-h-[380px] flex flex-col justify-between" id="learning-viewport">
        <!-- Injected via mode render function -->
      </div>

      <!-- Navigation & Shortcuts Footer -->
      <div class="flex items-center justify-between bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <button onclick="prevItem()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition">
          <i class="fa-solid fa-arrow-left"></i> 이전 문항 (Alt+←)
        </button>

        <div class="text-xs text-slate-400 hidden sm:flex items-center gap-3">
          <span><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-600 font-mono">Space</kbd> 정답 확인</span>

          다음 문항 (Alt+→) <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </section>
  </main>

            checkTypingTest();
          }
          return;

          e.preventDefault();

          e.preventDefault();
          prevItem();

    function getFilteredItems() {
      return curriculumData.filter(item => {
        const matchesCategory = currentCategory === 'all' || item.catId === currentCategory;
        const matchesBookmark = !bookmarkFilterOnly || bookmarks.has(item.id);
        return matchesCategory && matchesBookmark;
      });
    }

    function updateFilteredItemList() {
      const items = getFilteredItems();
      const listEl = document.getElementById('subitem-list');
      const countEl = document.getElementById('section-item-count');
      const currentCatObj = categories.find(c => c.id === currentCategory);
      document.getElementById('current-section-title').innerText = currentCatObj ? currentCatObj.name : '항목';
      countEl.innerText = `${items.length} 항목`;

      if (items.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-slate-400 py-6 text-center">해당 조건의 문항이 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = items.map((item, idx) => {
        const isSelected = getFilteredItems()[currentIndex]?.id === item.id;
        const isMastered = masteredItems.has(item.id);
        const isBookmarked = bookmarks.has(item.id);

        return `
          <div onclick="selectItemById('${item.id}')" class="cursor-pointer p-2 rounded-xl text-xs flex items-center justify-between transition border ${
            isSelected 
              ? 'bg-indigo-50 border-indigo-300 text-indigo-950 font-bold' 
              : 'hover:bg-slate-50 border-transparent text-slate-700'
          }">
            <div class="flex items-center gap-1.5 truncate pr-2">
              <span class="text-[10px] w-4 text-slate-400">${idx + 1}.</span>
              <span class="truncate">${item.title}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${isBookmarked ? '<i class="fa-solid fa-star text-[10px] text-amber-500"></i>' : ''}
              ${isMastered ? '<i class="fa-solid fa-circle-check text-[11px] text-emerald-500"></i>' : '<i class="fa-regular fa-circle text-[11px] text-slate-300"></i>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCategory(catId) {
      currentCategory = catId;
      currentIndex = 0;
      renderCategories();
      updateFilteredItemList();
      renderCurrentItem();
    }

    function selectItemById(id) {
      const items = getFilteredItems();
      const targetIdx = items.findIndex(it => it.id === id);
      if (targetIdx !== -1) {
        currentIndex = targetIdx;
        updateFilteredItemList();
        renderCurrentItem();
      }
    }

    function nextItem() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      if (currentIndex < items.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // loop
      }
      updateFilteredItemList();
      renderCurrentItem();
    }

    function prevItem() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = items.length - 1;
      }
      updateFilteredItemList();
      renderCurrentItem();
    }

    function toggleBookmarkFilter() {
      bookmarkFilterOnly = !bookmarkFilterOnly;
      const btn = document.getElementById('btn-toggle-bookmark-only');
      if (bookmarkFilterOnly) {
        btn.classList.add('bg-amber-500', 'text-slate-900', 'font-bold');
        btn.classList.remove('bg-indigo-800', 'text-indigo-200');
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-900', 'font-bold');
        btn.classList.add('bg-indigo-800', 'text-indigo-200');
      }
      currentIndex = 0;
      updateFilteredItemList();
      renderCurrentItem();
    }

    function toggleCurrentBookmark() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      if (bookmarks.has(curItem.id)) {
        bookmarks.delete(curItem.id);
      } else {
        bookmarks.add(curItem.id);
      }
      localStorage.setItem("math2022_bookmarks", JSON.stringify(Array.from(bookmarks)));
      renderBookmarkButton();
      updateFilteredItemList();
    }

    function renderBookmarkButton() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      const btnStar = document.getElementById('btn-star');
      if (bookmarks.has(curItem.id)) {
        btnStar.classList.add('text-amber-500');
        btnStar.classList.remove('text-slate-300');
      } else {
        btnStar.classList.remove('text-amber-500');
        btnStar.classList.add('text-slate-300');
      }
    }

    function markAsMastered() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      if (masteredItems.has(curItem.id)) {
        masteredItems.delete(curItem.id);
      } else {
        masteredItems.add(curItem.id);
      }
      localStorage.setItem("math2022_mastered", JSON.stringify(Array.from(masteredItems)));
      updateMasteredButton();
      updateHeaderStats();
      updateFilteredItemList();
    }

    function updateMasteredButton() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      const btnCheck = document.getElementById('btn-check');
      if (masteredItems.has(curItem.id)) {
        btnCheck.classList.remove('text-slate-600', 'border-slate-300');
        btnCheck.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
        btnCheck.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>암기 완료됨</span>`;
      } else {
        btnCheck.classList.add('text-slate-600', 'border-slate-300');
        btnCheck.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-500');
        btnCheck.innerHTML = `<i class="fa-regular fa-circle-check"></i> <span>암기 완료 표시</span>`;
      }
    }

    function resetAllProgress() {
      if (confirm("암기 완료 및 북마크 진도를 모두 초기화하시겠습니까?")) {
        masteredItems.clear();
        bookmarks.clear();
        localStorage.removeItem("math2022_mastered");
        localStorage.removeItem("math2022_bookmarks");
        updateHeaderStats();
        updateFilteredItemList();
        renderCurrentItem();
      }
    }

    /* =====================================================================
       Mode Switching & View Rendering
       ===================================================================== */
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white', 'shadow');
        b.classList.add('text-indigo-200');
      });
      const activeBtn = document.getElementById(`mode-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-indigo-200');
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow');
      }

      renderSubControls();
      renderCurrentItem();
    }

    function renderSubControls() {
      const ctrl = document.getElementById('mode-sub-controls');
      ctrl.innerHTML = '';

      if (currentMode === 'study') {
        ctrl.innerHTML = `
          <button onclick="toggleHideStudy()" class="px-2.5 py-1 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
            <i class="fa-solid ${hideStudyText ? 'fa-eye' : 'fa-eye-slash'}"></i>
            <span>${hideStudyText ? '문장 보이기' : '문장 가리기'}</span>
          </button>
        `;
      } else if (currentMode === 'cloze') {
        ctrl.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="text-indigo-300 text-[11px] font-semibold">빈칸 난이도:</span>
            <div class="inline-flex bg-indigo-950 p-0.5 rounded-lg border border-indigo-700/60 shadow-inner">
              <button onclick="setClozeLevel('easy')" class="px-2.5 py-1 text-xs rounded-md font-semibold transition ${clozeLevel==='easy'?'bg-emerald-500 text-white shadow':'text-indigo-200 hover:text-white'}">
                초급 (20%)
              </button>
              <button onclick="setClozeLevel('medium')" class="px-2.5 py-1 text-xs rounded-md font-semibold transition ${clozeLevel==='medium'?'bg-amber-500 text-slate-950 font-bold shadow':'text-indigo-200 hover:text-white'}">
                중급 (45%)
              </button>
              <button onclick="setClozeLevel('hard')" class="px-2.5 py-1 text-xs rounded-md font-semibold transition ${clozeLevel==='hard'?'bg-rose-500 text-white font-bold shadow':'text-indigo-200 hover:text-white'}">
                고급 (75%)
              </button>
            </div>
            <button onclick="revealAllAnswers()" class="ml-1 px-2.5 py-1 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 rounded-lg text-xs font-medium transition flex items-center gap-1">
              <i class="fa-solid fa-key text-[10px]"></i> 정답 보기
            </button>
          </div>
        `;
      } else if (currentMode === 'firstchar') {
        ctrl.innerHTML = `
          <button onclick="revealAllAnswers()" class="px-2.5 py-1 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 rounded-lg text-xs transition">전체 정답 보기</button>
        `;
      }
    }

    function setClozeLevel(lvl) {
      clozeLevel = lvl;
      renderSubControls();
      renderCurrentItem();
    }

    function toggleHideStudy() {
      hideStudyText = !hideStudyText;
      renderSubControls();
      renderCurrentItem();
    }

    /* =====================================================================
       Current Item Master Render
       ===================================================================== */
    function renderCurrentItem() {
      const items = getFilteredItems();
      const viewport = document.getElementById('learning-viewport');

      if (items.length === 0) {
        viewport.innerHTML = `
          <div class="flex flex-col items-center justify-center h-64 text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
            <p class="text-sm">선택된 조건에 해당하는 문항이 없습니다.</p>
          </div>
        `;
        return;
      }

      if (currentIndex >= items.length) currentIndex = 0;
      const item = items[currentIndex];

      // Update Header Card info
      document.getElementById('badge-page').innerText = `${item.page}페이지`;
      document.getElementById('badge-cat').innerText = item.catName;
      document.getElementById('badge-num').innerText = `#${currentIndex + 1}/${items.length}`;
      document.getElementById('current-item-title').innerText = item.title;
      document.getElementById('current-item-path').innerText = `${item.catName} > ${item.title}`;

      renderBookmarkButton();
      updateMasteredButton();

      // Render Viewport by Mode
      switch (currentMode) {
        case 'study':
          renderStudyMode(item, viewport);
          break;
        case 'firstchar':
          renderFirstCharMode(item, viewport);
          break;
        case 'cloze':
          renderClozeMode(item, viewport);
          break;
        case 'typing':
          renderTypingMode(item, viewport);
          break;
      }
    }

    /* -------------------------------------------------------------
       Mode 1: 정독 및 블라인드 (Study & Hide)
       ------------------------------------------------------------- */
    function renderStudyMode(item, container) {
      let highlighted = item.text;
      item.keywords.forEach(kw => {
        const reg = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g');
        highlighted = highlighted.replace(reg, `<mark class="bg-amber-100 text-amber-900 font-semibold px-1 rounded">$1</mark>`);
      });

      container.innerHTML = `
        <div class="flex-1 flex flex-col justify-center">
          <div class="mb-4 flex items-center justify-between text-xs text-slate-500 font-semibold border-b pb-2">
            <span><i class="fa-regular fa-eye mr-1"></i> 원문 정독 (클릭하여 핵심 키워드 확인)</span>
            <span class="text-slate-400">원문 글자 수: ${item.text.length}자</span>
          </div>

          <div class="p-6 rounded-2xl bg-slate-50 border border-slate-200 transition-all cursor-pointer relative" onclick="toggleHideStudy()">
            ${
              hideStudyText
                ? `<div class="py-12 text-center text-slate-400 select-none">
                     <i class="fa-solid fa-lock text-3xl mb-2 text-indigo-400"></i>
                     <p class="font-bold text-slate-600">내용이 가려져 있습니다.</p>
                     <p class="text-xs text-slate-400 mt-1">이 영역을 클릭하거나 스페이스바를 누르면 원문이 표시됩니다.</p>
                   </div>`
                : `<div class="text-base sm:text-lg leading-relaxed sm:leading-loose text-slate-800 font-medium select-text">
                     ${highlighted}
                   </div>`
            }
          </div>

          <!-- Keywords pill box -->
          <div class="mt-6">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">핵심 인출 키워드 체크리스트</h4>
            <div class="flex flex-wrap gap-2">
              ${item.keywords.map(kw => `
                <span class="text-xs bg-indigo-50 border border-indigo-200 text-indigo-800 px-3 py-1 rounded-lg font-medium flex items-center gap-1.5">

    /* -------------------------------------------------------------
       Mode 2: 초성/첫 글자 연상 모드 (First-Letter Prompt)
       ------------------------------------------------------------- */
    function renderFirstCharMode(item, container) {
      // Split into words, show only the first letter or character, rest replaced with dots or hidden
      const words = item.text.split(/(\s+)/);
      const promptHtml = words.map((w, idx) => {
        if (/^\s+$/.test(w)) return w; // preserves spaces
        const firstChar = w.charAt(0);
        const remainder = w.slice(1);
        return `<span class="inline-block mx-0.5 group cursor-pointer" onclick="this.querySelector('.rest').classList.toggle('hidden')">
          <span class="font-bold text-indigo-600 bg-indigo-50 px-1 py-0.5 rounded border border-indigo-200">${firstChar}</span><span class="rest text-slate-400 border-b border-dashed border-slate-300 hidden">${remainder}</span><span class="text-slate-300 text-xs tracking-widest">${'_'.repeat(Math.min(remainder.length, 3))}</span>
        </span>`;
      }).join('');

      container.innerHTML = `
        <div class="flex-1 flex flex-col justify-center">
          <div class="mb-3 flex items-center justify-between text-xs text-slate-500 border-b pb-2 font-semibold">
            <span><i class="fa-solid fa-font text-indigo-500 mr-1"></i> 첫 글자(어절 두문자) 힌트 암기</span>
            <span class="text-indigo-600">각 어절을 클릭하면 숨겨진 글자가 열립니다.</span>
          </div>

          <div class="p-6 rounded-2xl bg-slate-50 border border-slate-200 min-h-[160px] text-base sm:text-lg leading-relaxed select-none">
            ${promptHtml}
          </div>

          <div id="firstchar-answer" class="mt-4 p-4 rounded-xl bg-indigo-50/50 border border-indigo-100 hidden">
            <span class="text-xs font-bold text-indigo-800 block mb-1">원문 전체 확인:</span>
            <p class="text-sm text-slate-700 leading-relaxed">${item.text}</p>
          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------
       Mode 3: 단계별 빈칸 채우기 (Cloze Test)
       ------------------------------------------------------------- */
    function renderClozeMode(item, container) {
      // 난이도별 빈칸 비율 및 설명
      const config = {
        easy: { ratio: 0.20, label: '초급 (핵심 키워드 위주 20%)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        medium: { ratio: 0.45, label: '중급 (핵심구 + 주요서술어 45%)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300' },
        hard: { ratio: 0.75, label: '고급 (조사 제외 거의 전체 75%)', badgeClass: 'bg-rose-100 text-rose-800 border-rose-300' }
      };
      const curConfig = config[clozeLevel] || config.medium;

      // 정규식으로 어절 및 공백 분리
      const tokens = item.text.match(/\S+|\s+/g) || [];

      // 단어 인덱스 목록 (공백 제외)
      const wordIndices = [];
      tokens.forEach((tok, idx) => {
        if (!/^\s+$/.test(tok)) {
          wordIndices.push(idx);
        }
      });

      // 단어가 기호(①, (가) 등)로만 되어있는지 체크
      const isSymbolOnly = (str) => /^[①-⑩\(\)\[\]가-하0-9\.\,\·\-\s]+$/.test(str);

      // 빈칸 후보 선정 (기호 단독이 아닌 단어)
      const candidates = wordIndices.filter(idx => {
        const word = tokens[idx].trim();
        return word.length > 0 && !isSymbolOnly(word);
      });

      // 확실한 차이를 위한 목표 빈칸 수 계산 (최소 1개, 최대 candidates 길이)
      const targetCount = Math.max(1, Math.min(candidates.length, Math.round(candidates.length * curConfig.ratio)));

      // 키워드 어절 점수 매기기 (초급/중급 시 우선 선별)
      const keywordSet = (item.keywords || []).map(k => k.replace(/[.,·()]/g, '').trim()).filter(Boolean);
      
      const scoredCandidates = candidates.map((idx, pos) => {
        const cleanWord = tokens[idx].replace(/[.,·()①-⑩]/g, '').trim();
        let score = 0;
        // 키워드 일치 점수
        keywordSet.forEach(kw => {
          if (kw.includes(cleanWord) || cleanWord.includes(kw)) {
            score += 10;
          }
        });
        // 단어 길이가 길수록 우선순위
        score += Math.min(cleanWord.length, 6);
        return { idx, pos, score, cleanWord };
      });

      const selectedIndices = new Set();

      if (clozeLevel === 'easy') {
        // 초급: 가장 중요한 키워드 어절 상위권에서 균일하게 분산 선택
        scoredCandidates.sort((a, b) => b.score - a.score);
        const topPool = scoredCandidates.slice(0, Math.max(targetCount, Math.round(candidates.length * 0.4)));
        // 자연스러운 간격 유지를 위해 위치 순으로 재정렬 후 간격 선택
        topPool.sort((a, b) => a.pos - b.pos);
        const step = Math.max(1, Math.floor(topPool.length / targetCount));
        for (let i = 0; i < topPool.length && selectedIndices.size < targetCount; i += step) {
          selectedIndices.add(topPool[i].idx);
        }
        // 부족분 채우기
        for (let i = 0; i < topPool.length && selectedIndices.size < targetCount; i++) {
          selectedIndices.add(topPool[i].idx);
        }
      } else if (clozeLevel === 'medium') {
        // 중급: 45% 내외로 고르게 빈칸 배치 (키워드 + 문맥 단어 교차)
        const step = candidates.length / targetCount;
        for (let i = 0; i < targetCount; i++) {
          const pickIndex = Math.min(candidates.length - 1, Math.floor(i * step));
          selectedIndices.add(candidates[pickIndex]);
        }
      } else {
        // 고급: 75% 대폭 뚫기 (연속된 기호류 제외하고 거의 다 뚫음)
        // 4개 중 3개 꼴로 빈칸 설정
        candidates.forEach((candIdx, pos) => {
          if (selectedIndices.size < targetCount) {
            // 4단어 중 3개 선택 (pos % 4 !== 3)
            if (pos % 4 !== 3 || selectedIndices.size + (candidates.length - pos) <= targetCount) {
              selectedIndices.add(candIdx);
            }
          }
        });
        // 여전히 부족하면 남은 후보 모두 채움
        for (let i = 0; i < candidates.length && selectedIndices.size < targetCount; i++) {
          selectedIndices.add(candidates[i]);
        }
      }

      // 안전망: 만약 모종의 이유로 아무것도 선택되지 않았다면 첫 번째 유효 단어 강제 선택
      if (selectedIndices.size === 0 && candidates.length > 0) {
        selectedIndices.add(candidates[0]);
      }

      let blankCounter = 0;
      const htmlOutput = tokens.map((tok) => {
        if (/^\s+$/.test(tok)) {
          return tok; // 공백 보존
        }

        const tokenIdx = tokens.indexOf(tok);
        // 복수 매칭 방지를 위해 selectedIndices 확인
        if (!selectedIndices.has(tokenIdx)) {
          return `<span class="text-slate-800 font-semibold">${escapeHtml(tok)}</span>`;
        }

        blankCounter++;
        // 앞/뒤 구두점(괄호, 마침표, 쉼표 등) 분리
        const match = tok.match(/^([(\[{]*)(\S+?)([)\]}.,;·]*)$/);
        const prefix = match ? match[1] : '';
        const core = match ? match[2] : tok;
        const suffix = match ? match[3] : '';

        // 입력창 너비 계산
        const inputWidth = Math.max(65, Math.min(230, core.length * 18 + 24));
        const hintChar = core.length > 0 ? core.charAt(0) : '';

        return `${prefix}<span class="inline-flex items-center mx-1 my-1 align-baseline relative group">
          <input type="text"
                 data-answer="${escapeHtml(core)}"
                 data-index="${blankCounter}"
                 id="cloze-input-${blankCounter}"
                 style="width: ${inputWidth}px"
                 class="cloze-input text-center text-sm font-bold border-2 border-indigo-400 bg-amber-50/70 rounded-lg px-2 py-1 text-indigo-950 focus:outline-none focus:border-indigo-600 focus:bg-white focus:ring-2 focus:ring-indigo-300 transition shadow-sm placeholder:text-indigo-400 placeholder:font-normal"
                 placeholder="${core.length}자"
                 title="힌트: 첫 글자는 '${hintChar}' 입니다"
                 autocomplete="off"
                 oninput="checkClozeIndividual(this)" />
        </span>${suffix}`;
      }).join('');

      container.innerHTML = `
        <div class="flex-1 flex flex-col justify-between">
          <div>
            <!-- Cloze Status Header -->
            <div class="mb-4 flex flex-wrap items-center justify-between gap-2 border-b pb-3 text-xs">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-full text-xs font-bold border ${curConfig.badgeClass}">
                  ${curConfig.label}
                </span>
                <span class="font-bold text-slate-700">
                  빈칸 총 <span class="text-indigo-600 font-extrabold text-sm">${blankCounter}</span> / ${candidates.length} 어절
                </span>
              </div>
              <div class="flex items-center gap-2 text-slate-500">
                <span class="hidden sm:inline text-[11px]"><i class="fa-regular fa-lightbulb text-amber-500 mr-1"></i>빈칸에 마우스를 올리면 첫 글자 힌트가 뜹니다.</span>
                <button onclick="revealAllAnswers()" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold underline cursor-pointer">
                  전체 정답 확인
                </button>
              </div>
            </div>

            <!-- Cloze Text Body -->
            <div class="p-6 sm:p-7 rounded-2xl bg-slate-50 border border-slate-200 min-h-[220px] text-base sm:text-lg leading-loose select-none">
              ${htmlOutput}
            </div>
          </div>

          <!-- Cloze Answer Full Panel -->
          <div id="cloze-answer-panel" class="mt-4 p-4 rounded-xl bg-indigo-50/90 border border-indigo-200 hidden">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-indigo-900 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-600"></i> 원문 전체 확인:
              </span>
              <button onclick="document.getElementById('cloze-answer-panel').classList.add('hidden')" class="text-xs text-indigo-600 hover:text-indigo-900 font-bold">
                ✕ 닫기
              </button>
            </div>
            <p class="text-sm text-slate-800 leading-relaxed font-sans select-text">${escapeHtml(item.text)}</p>
          </div>
        </div>
      `;

      // 첫 번째 빈칸으로 자동 포커스
      setTimeout(() => {
        const firstInput = container.querySelector('.cloze-input');
        if (firstInput) firstInput.focus();
      }, 50);
    }

    function checkClozeIndividual(inputEl) {
      const target = (inputEl.dataset.answer || '').trim();
      const val = inputEl.value.trim();

      if (val === target) {
        inputEl.classList.remove('border-indigo-400', 'border-rose-400', 'bg-amber-50/70', 'bg-rose-50');
        inputEl.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
        // 다음 빈칸으로 자동 포커스 이동 편의 제공
        const nextId = parseInt(inputEl.dataset.index || '0') + 1;
        const nextInput = document.getElementById(`cloze-input-${nextId}`);
        if (nextInput) {
          nextInput.focus();
        }
      } else if (val.length >= target.length && val !== target) {
        inputEl.classList.add('border-rose-400', 'bg-rose-50');
        inputEl.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
      } else {
        inputEl.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-800', 'border-rose-400', 'bg-rose-50');
        inputEl.classList.add('border-indigo-400', 'bg-amber-50/70');
      }
    }

    function revealAllAnswers() {
      if (currentMode === 'firstchar') {
        const box = document.getElementById('firstchar-answer');
        if (box) box.classList.toggle('hidden');
      } else if (currentMode === 'cloze') {
        document.querySelectorAll('.cloze-input').forEach(input => {
          input.value = input.dataset.answer;
          input.classList.remove('border-indigo-300', 'border-rose-400');
          input.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
        });
        const box = document.getElementById('cloze-answer-panel');
        if (box) box.classList.toggle('hidden');
      }
    }

    /* -------------------------------------------------------------
       Mode 4: 백지 인출 & 정밀 대조기 (Typing & Precise Diff Engine)
       ------------------------------------------------------------- */
    function renderTypingMode(item, container) {
      container.innerHTML = `
        <div class="flex-1 flex flex-col">
          <div class="mb-3 flex items-center justify-between text-xs text-slate-500 border-b pb-2 font-semibold">
            <span class="flex items-center gap-1.5 text-indigo-700">
              <i class="fa-solid fa-keyboard"></i>
              <span>백지 인출 (토시 하나 틀리지 않게 암기하여 입력하세요)</span>
            </span>
            <span class="text-slate-400">원문 ${item.text.length}자</span>
          </div>

          <div class="grid grid-cols-1 gap-4 flex-1">
            <textarea id="typing-input" rows="6" class="w-full p-4 rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 font-medium text-base text-slate-800 placeholder-slate-400 transition resize-none custom-scrollbar" placeholder="이곳에 원문을 기억나는 대로 토시 하나 틀리지 않게 타이핑하세요... (완료 후 [정밀 대조 및 채점] 클릭)"></textarea>

            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <button onclick="checkTypingTest()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition shadow flex items-center gap-2">
                  <i class="fa-solid fa-spell-check"></i>
                  <span>정밀 대조 및 채점 (Alt+Enter)</span>
                </button>
                <button onclick="fillOriginalToInput()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-xl transition">
                  원문 불러오기
                </button>
              </div>

              <div id="diff-score-badge" class="hidden text-xs font-bold px-3 py-1.5 rounded-xl border">
                <!-- Accuracy Score -->
              </div>
            </div>

            <!-- Real-time Detailed Diff Result Section -->
            <div id="diff-output-panel" class="hidden mt-2 p-5 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col gap-3">
              <div class="flex items-center justify-between text-xs font-bold text-slate-600">
                <span>글자 단위 정밀 대조 결과:</span>
                <div class="flex items-center gap-3 text-[11px]">
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-200 border border-emerald-400 inline-block"></span> 일치</span>
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-200 border border-rose-400 inline-block"></span> 누락(원문)</span>
                  <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-200 border border-amber-400 inline-block"></span> 오탈자/추가</span>
                </div>
              </div>

              <div id="diff-content" class="p-4 bg-white rounded-xl border border-slate-200 text-sm sm:text-base leading-relaxed tracking-wide font-medium"></div>

              <div class="mt-1 pt-3 border-t border-slate-200">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">원문 표준 텍스트</span>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed font-sans select-text">${item.text}</p>
              </div>
            </div>
          </div>
        </div>
      `;

      // Auto-focus textarea
      setTimeout(() => {
        const t = document.getElementById('typing-input');
        if (t) t.focus();
      }, 50);
    }

    function fillOriginalToInput() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      const input = document.getElementById('typing-input');
      if (input) {
        input.value = curItem.text;
        input.focus();
      }
    }

    /* =====================================================================
       LCS / Character-level Diff Engine
       ===================================================================== */
    function checkTypingTest() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];
      const inputEl = document.getElementById('typing-input');
      if (!inputEl) return;

      const userText = inputEl.value;
      const targetText = curItem.text;

      const diffResult = computeCharacterDiff(targetText, userText);
      const scoreBadge = document.getElementById('diff-score-badge');
      const diffPanel = document.getElementById('diff-output-panel');
      const diffContent = document.getElementById('diff-content');

      // Calculate accuracy
      const matchCount = diffResult.filter(d => d.type === 'correct').reduce((acc, d) => acc + d.val.length, 0);
      const totalTargetLen = targetText.length;
      const accuracy = totalTargetLen === 0 ? 100 : Math.max(0, Math.round((matchCount / totalTargetLen) * 100));

      // Build HTML Diff representation
      diffContent.innerHTML = diffResult.map(d => {
        if (d.type === 'correct') {
          return `<span class="diff-correct">${escapeHtml(d.val)}</span>`;
        } else if (d.type === 'missing') {
          return `<span class="diff-missing" title="원문에 누락됨">${escapeHtml(d.val)}</span>`;
        } else if (d.type === 'extra') {
          return `<span class="diff-extra" title="원문에 없는 추가/오탈자">${escapeHtml(d.val)}</span>`;
        }
      }).join('');

      diffPanel.classList.remove('hidden');

      // Update Score Badge
      scoreBadge.classList.remove('hidden');
      if (accuracy === 100) {
        scoreBadge.className = "text-xs font-bold px-3 py-1.5 rounded-xl border bg-emerald-500 text-white border-emerald-500 flex items-center gap-1.5";
        scoreBadge.innerHTML = `<i class="fa-solid fa-trophy"></i> <span>100% 토시 하나 틀리지 않고 완벽 일치!</span>`;
        // Auto mark as mastered
        if (!masteredItems.has(curItem.id)) {
          markAsMastered();
        }
      } else if (accuracy >= 80) {
        scoreBadge.className = "text-xs font-bold px-3 py-1.5 rounded-xl border bg-amber-50 text-amber-800 border-amber-300 flex items-center gap-1.5";
        scoreBadge.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>일치율: ${accuracy}% (조금만 더 정밀하게 다듬어보세요)</span>`;
      } else {
        scoreBadge.className = "text-xs font-bold px-3 py-1.5 rounded-xl border bg-rose-50 text-rose-800 border-rose-300 flex items-center gap-1.5";
        scoreBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>일치율: ${accuracy}% (빨간색 누락된 문구를 점검하세요)</span>`;
      }
    }

    // Longest Common Subsequence algorithm on character arrays
    function computeCharacterDiff(target, input) {
      const m = target.length;
      const n = input.length;
      const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));

      for (let i = 0; i < m; i++) {
        for (let j = 0; j < n; j++) {
          if (target[i] === input[j]) {
            dp[i + 1][j + 1] = dp[i][j] + 1;
          } else {
            dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
      }

      const diff = [];
      let i = m;
      let j = n;

      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && target[i - 1] === input[j - 1]) {
          diff.push({ type: 'correct', val: target[i - 1] });
          i--;
          j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          diff.push({ type: 'extra', val: input[j - 1] });
          j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
          diff.push({ type: 'missing', val: target[i - 1] });
          i--;
        }
      }

      diff.reverse();

      // Compress consecutive same-type diff tokens for cleaner DOM rendering
      const compressed = [];
      diff.forEach(item => {
        if (compressed.length > 0 && compressed[compressed.length - 1].type === item.type) {
          compressed[compressed.length - 1].val += item.val;
        } else {
          compressed.push({ type: item.type, val: item.val });
        }
      });

      return compressed;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =====================================================================
       TTS Voice Reader
       ===================================================================== */
    function speakCurrentText() {
      const items = getFilteredItems();
      if (items.length === 0) return;
      const curItem = items[currentIndex];

      if (!('speechSynthesis' in window)) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(curItem.text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  </script>
